name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  ci:
    name: Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared-types
        run: pnpm --filter @mentorqa/shared-types build

      - name: Typecheck all workspaces
        run: pnpm turbo typecheck

      - name: Lint all workspaces
        run: pnpm turbo lint

      - name: Build all workspaces
        run: pnpm turbo build

      - name: Setup Python (for analysis service)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/analysis/requirements.txt

      - name: Install Python dependencies
        run: pip install -r services/analysis/requirements.txt

      - name: Lint Python (analysis service)
        run: |
          pip install ruff
          ruff check services/analysis/
